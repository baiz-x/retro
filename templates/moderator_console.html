<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Order Links</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="csrf-token" content="{{ csrf_token() }}" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fcfcfc] text-[#0a192f] antialiased min-h-screen"
      data-token="{{ token }}"
      {% if mod %}data-expires="{{ mod.expires_at.isoformat() }}Z"{% endif %}>

<main class="max-w-lg mx-auto px-4 pt-5 pb-24">

  {% if error %}
  <!-- Dead / revoked / expired moderator link -->
  <div class="mt-16 text-center border border-[#0a192f]/10 rounded-2xl bg-white p-8">
    <h1 class="text-lg font-bold uppercase tracking-widest mb-2">Link unavailable</h1>
    <p class="text-sm text-[#0a192f]/60">{{ error }}</p>
    <p class="text-xs text-[#0a192f]/40 mt-4">Ask the shop owner for a new moderator link.</p>
  </div>

  {% else %}
  <header class="flex items-start justify-between mb-5">
    <div>
      <h1 class="text-lg font-bold uppercase tracking-widest">Order links</h1>
      <p class="text-[11px] text-[#0a192f]/50">Hi {{ mod.label }} · <span id="expiryNote"></span></p>
    </div>
  </header>

  <div class="flex rounded-full bg-[#0a192f]/5 p-1 mb-5" role="tablist">
    <button type="button" id="tabNew" data-tab="new" class="mod-tab flex-1 py-3 rounded-full text-[10px] uppercase font-bold tracking-widest">New link</button>
    <button type="button" id="tabMine" data-tab="mine" class="mod-tab flex-1 py-3 rounded-full text-[10px] uppercase font-bold tracking-widest">My links</button>
  </div>

  <p id="catalogError" class="hidden text-sm text-red-600 mb-4"></p>

  <section id="paneNew"><div id="builderMount"></div></section>

  <section id="paneMine" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <p class="text-[9px] uppercase font-bold text-[#0a192f]/60 tracking-widest">Links you made</p>
      <button type="button" id="refreshLinks" class="text-[10px] uppercase font-bold tracking-widest text-[#0a192f]/60 py-2 px-2">Refresh</button>
    </div>
    <div id="linksList" class="space-y-3"></div>
  </section>
  {% endif %}

</main>

<script src="/static/link_builder.js"></script>
<script src="/static/moderator_console.js"></script>
</body>
</html>
