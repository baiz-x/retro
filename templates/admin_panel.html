<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markazus sunnah Admin | Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">

</head>
<body class="bg-khaki text-gray-900 font-sans antialiased">
<div id="loading-spinner" class="fixed inset-0 bg-white/80 z-[60] hidden flex items-center justify-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-black"></div>
</div>

<div class="flex h-screen overflow-hidden">
    <aside class="hidden md:flex flex-col w-64 bg-black text-white shrink-0">
        <div class="h-20 flex items-center justify-center border-b border-gray-700">
            <span class="text-2xl font-serif font-bold tracking-tighter">Markazus Sunnah</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#products-section" class="sidebar-link-transition flex items-center px-4 py-3 text-sm font-medium bg-white/10 rounded-lg text-white">
                <span>Products</span>
            </a>
            <a href="#orders-section" class="sidebar-link-transition flex items-center px-4 py-3 text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white rounded-lg">
                <span>Orders</span>
            </a>
        </nav>
        <div class="p-4 border-t border-gray-700">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-khaki flex items-center justify-center text-[#C8A86A] font-bold text-xs">AD</div>
                <div class="text-xs">
                    <p class="font-medium text-white">Admin User</p>
                </div>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h1 class="text-xl font-serif font-bold text-black">Dashboard Overview</h1>
            <button id="logout-btn" class="px-4 py-2 text-sm text-red-600 font-medium hover:bg-red-50 rounded-lg transition border border-transparent hover:border-red-100">
                Sign Out
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-8 scroll-smooth">
            <section id="products-section" class="mb-12">
                <div class="flex flex-col xl:flex-row gap-8">
                    <div class="w-full xl:w-1/3">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-6 desktop-card-hover">
                            <h2 class="text-lg font-bold text-black mb-4 font-serif">Add New Product</h2>
                            <form id="add-product-form" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
                                    <input type="text" name="name" required class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="e.g. Midnight Jasmine">
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Main Category</label>
                                        <input type="text" id="parent-category-input" required class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="e.g. attar">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Sub Category</label>
                                        <input type="text" id="sub-category-input" required class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="e.g. oud">
                                    </div>
                                </div>
                                <input type="hidden" name="category" id="combined-category">

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Price</label>
                                        <input type="number" step="0.01" name="price" required class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="0.00">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Stock</label>
                                        <input type="number" name="stock" class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="Qty">
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold ml-1">Variations (Size:Price:Stock)</label>
                                    <input type="text" id="variants-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#C8A86A] outline-none transition-all" placeholder="e.g. 6ml:500:10 / 12ml:900:5">
                                </div>

                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Description</label>
                                    <textarea name="description" required rows="3" class="w-full rounded-lg border-gray-200 focus:border-[#C8A86A] focus:ring focus:ring-[#C8A86A]/20 text-sm p-2.5 bg-gray-50" placeholder="Enter product details and notes..."></textarea>
                                </div>

                                <div class="grid grid-cols-1 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Main Image</label>
                                        <input type="file" name="image" accept="image/*" required class="w-full rounded-lg border-gray-200 text-sm p-2 bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-[#C8A86A] file:text-white file:cursor-pointer">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Gallery Images (Optional)</label>
                                        <input type="file" name="gallery" accept="image/*" multiple class="w-full rounded-lg border-gray-200 text-sm p-2 bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-black file:text-white file:cursor-pointer">
                                    </div>
                                </div>              

                                <button type="submit" class="w-full bg-[#C8A86A] text-white font-bold text-sm py-3 rounded-lg hover:bg-black transition-colors duration-300">Create Product</button>
                            </form>
                        </div>
                    </div>

                    <div class="w-full xl:w-2/3">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden desktop-card-hover">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                                        <tr>
                                            <th class="px-6 py-4">ID</th>
                                            <th class="px-6 py-4">Name/Category</th>
                                            <th class="px-6 py-4">Price</th>
                                            <th class="px-6 py-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="products-table-body" class="divide-y divide-gray-100 text-sm"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <hr class="border-gray-200 my-12">

            <section id="orders-section">
                <h2 class="text-2xl font-serif font-bold text-black mb-6 italic">Recent Orders</h2>
                <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            </section>
        </main>
    </div>
</div>

<div id="order-detail-modal" class="fixed inset-0 bg-black/60 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-lg lg:max-w-2xl rounded-[40px] overflow-hidden shadow-2xl">
        <div class="p-8 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
            <div>
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Order Details</span>
                <h3 class="font-serif font-bold text-2xl text-black">Purchased Items</h3>
            </div>
            <button type="button" class="btn-close-modal w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm hover:text-red-500 transition">
                <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div id="modal-items-content" class="p-8 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
        <div class="p-8 bg-white border-t border-gray-50 flex justify-between items-center">
            <div>
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Grand Total</span>
                <p id="modal-total-price" class="font-serif font-bold text-2xl text-black">$0.00</p>
            </div>
            <button type="button" class="btn-close-modal px-8 py-3 bg-black text-white rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:bg-gray-800 transition">Close</button>
        </div>
    </div>
</div>

<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>
<script src="{{ url_for('static', filename='admin_panel.js') }}"></script>

</body>
</html>
